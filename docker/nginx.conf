# Nginx interne au conteneur de la PWA : sert l'export statique d'Expo.
# Le HTTPS et le routage vers l'API sont gérés par le Nginx du serveur.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Fichiers d'Expo dont le nom contient un hash : jamais modifiés.
    location /_expo/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Le service worker et le manifeste doivent toujours être relus,
    # sinon une nouvelle version ne serait jamais détectée.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # Route dynamique d'expo-router : /chat/123 → chat/[id].html
    location ~ ^/chat/[^/]+/?$ {
        add_header Cache-Control "no-cache";
        try_files "/chat/[id].html" =404;
    }

    # Pages : /login → login.html, sinon page « introuvable » d'Expo.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /+not-found.html;
}
